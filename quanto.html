<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>QUANTO — Hidden Proportions</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Mono:wght@300;400;500&family=Syne:wght@400;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080809;--s1:#0f0f13;--s2:#16161d;
  --border:rgba(255,255,255,0.07);
  --g:#b8f098;--b:#7eb8f7;--gold:#f7c97e;--orange:#f7a07e;--violet:#a78bfa;
  --text:#dddde8;--muted:#55556a;--dim:#252530;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(ellipse 70% 40% at 20% 0%,rgba(184,240,152,.03),transparent),
             radial-gradient(ellipse 60% 40% at 80% 100%,rgba(126,184,247,.025),transparent);}
.wrap{position:relative;z-index:1;max-width:820px;margin:0 auto;padding:48px 24px 80px;}

/* HEADER */
header{text-align:center;margin-bottom:64px;}
.logo{font-family:'Syne',sans-serif;font-weight:800;font-size:clamp(64px,14vw,108px);
  letter-spacing:-5px;color:var(--g);line-height:1;display:inline-block;
  text-shadow:0 0 80px rgba(184,240,152,.12);}
.logo sup{font-size:.35em;color:var(--b);letter-spacing:0;vertical-align:super;}
.tagline{font-family:'Instrument Serif',serif;font-style:italic;font-size:17px;color:var(--muted);margin-top:14px;}

/* TABS */
.mode-tabs{display:flex;gap:0;margin-bottom:36px;background:var(--s1);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.tab{flex:1;padding:13px 16px;font-family:'Syne',sans-serif;font-weight:700;font-size:10px;
  letter-spacing:.12em;text-transform:uppercase;border:none;background:transparent;
  color:var(--muted);cursor:pointer;transition:all .15s;border-right:1px solid var(--border);}
.tab:last-child{border-right:none;}
.tab:hover{color:var(--text);}
.tab.active{background:var(--s2);color:var(--g);}
.tab .tab-sub{display:block;font-size:8px;font-weight:400;letter-spacing:.08em;color:var(--muted);margin-top:3px;font-family:'DM Mono',monospace;text-transform:none;}

/* PROP CARD */
.prop-card{background:var(--s1);border:1px solid var(--border);border-radius:6px;overflow:hidden;margin-bottom:24px;}
.dim-bar{display:grid;grid-template-columns:1fr 56px 1fr;border-bottom:1px solid var(--border);}
.dim-tag{padding:9px 18px;font-size:9px;letter-spacing:.2em;text-transform:uppercase;display:flex;align-items:center;gap:6px;}
.dim-tag.left{color:var(--g);border-right:1px solid var(--border);}
.dim-tag.right{color:var(--b);}
.dim-tag.right.orange{color:var(--orange);}
.dim-center{display:flex;align-items:center;justify-content:center;}
.pairs-grid{display:grid;grid-template-columns:1fr 56px 1fr;}
.pair-col{display:grid;grid-template-rows:1fr auto 1fr;}
.pair-item{padding:20px 22px 16px;display:flex;flex-direction:column;justify-content:center;gap:4px;}
.pair-item.top{border-bottom:1px solid var(--border);}
.pi-sub{font-size:9px;letter-spacing:.2em;text-transform:uppercase;opacity:.4;}
.pi-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(13px,2vw,17px);line-height:1.3;}
.pi-val{font-family:'Syne',sans-serif;font-weight:700;font-size:14px;letter-spacing:.02em;}
.pi-unit{font-size:10px;color:var(--muted);}
.pair-col.left .pair-item .pi-sub{color:var(--g);}
.pair-col.left .pair-item.top .pi-val{color:var(--g);}
.pair-col.left .pair-item.bottom .pi-val{color:rgba(184,240,152,.5);}
.pair-col.right .pair-item .pi-sub{color:var(--b);}
.pair-col.right .pair-item.top .pi-val{color:var(--b);}
.pair-col.right .pair-item.bottom .pi-val{color:rgba(126,184,247,.5);}
.pair-col.right.x-mode .pair-item .pi-sub{color:var(--orange);}
.pair-col.right.x-mode .pair-item.bottom .pi-val{color:var(--orange);}
.divider-col{border-left:1px solid var(--border);border-right:1px solid var(--border);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:14px 0;}
.ratio-pill{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;
  padding:4px 7px;border-radius:3px;text-align:center;line-height:1.3;white-space:nowrap;}
.ratio-pill.left{background:rgba(184,240,152,.08);color:var(--g);border:1px solid rgba(184,240,152,.18);}
.ratio-pill.right{background:rgba(126,184,247,.08);color:var(--b);border:1px solid rgba(126,184,247,.18);}
.ratio-pill.x{background:rgba(247,160,126,.08);color:var(--orange);border:1px solid rgba(247,160,126,.18);}
.eq-sym{font-family:'Syne',sans-serif;font-weight:800;font-size:24px;color:var(--gold);}
.pair-arrow{display:flex;align-items:center;justify-content:center;padding:7px;
  font-size:10px;color:var(--muted);border-bottom:1px solid var(--border);letter-spacing:.05em;}
.pi-empty{font-family:'Instrument Serif',serif;font-style:italic;font-size:13px;color:var(--dim);}

/* BUTTONS */
.btn-zone{display:flex;gap:10px;justify-content:center;margin-bottom:44px;flex-wrap:wrap;}
.btn-main{font-family:'Syne',sans-serif;font-weight:800;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;padding:14px 40px;border:none;border-radius:3px;
  cursor:pointer;transition:all .15s;background:var(--g);color:#060607;}
.btn-main:hover{background:#ccffb0;transform:translateY(-1px);}
.btn-reset{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;letter-spacing:.12em;
  text-transform:uppercase;padding:14px 22px;border-radius:3px;cursor:pointer;
  transition:all .15s;background:transparent;color:var(--muted);border:1px solid var(--dim);}
.btn-reset:hover{border-color:var(--orange);color:var(--orange);}

/* TROVA step cards */
.trova-wrap{display:none;}
.trova-wrap.visible{display:block;}
.step-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:22px;}
.step-card{background:var(--s1);border:1px solid var(--border);border-radius:4px;
  padding:13px 14px;display:flex;flex-direction:column;gap:5px;min-height:84px;position:relative;}
.step-card.active{border-color:rgba(247,201,126,.35);box-shadow:0 0 20px rgba(247,201,126,.05);}
.step-card.done-g{border-color:rgba(184,240,152,.25);}
.step-card.done-b{border-color:rgba(126,184,247,.25);}
.step-card.x-card{border-color:rgba(247,160,126,.2);background:var(--s2);}
.sc-num{font-size:8px;letter-spacing:.22em;text-transform:uppercase;}
.step-card.active .sc-num{color:var(--gold);}
.step-card.done-g .sc-num{color:var(--g);}
.step-card.done-b .sc-num{color:var(--b);}
.step-card.x-card .sc-num{color:var(--orange);}
.sc-name{font-family:'Instrument Serif',serif;font-style:italic;font-size:12px;line-height:1.3;}
.step-card.active .sc-name{color:var(--muted);}
.step-card.done-g .sc-name,.step-card.done-b .sc-name{color:var(--text);}
.step-card.x-card .sc-name{color:var(--orange);}
.sc-val{font-family:'Syne',sans-serif;font-weight:700;font-size:11px;}
.step-card.done-g .sc-val{color:var(--g);}
.step-card.done-b .sc-val{color:var(--b);}
.step-card.x-card .sc-val{color:var(--orange);}
.sc-pulse{position:absolute;top:9px;right:9px;width:5px;height:5px;border-radius:50%;
  background:var(--gold);animation:pulse 1.2s ease-in-out infinite;}
@keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.4;transform:scale(.7)}}

/* FILTER + CATALOG */
.filter-bar{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;align-items:center;}
.filter-label{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:var(--dim);}
.filter-btn{background:transparent;border:1px solid var(--dim);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:10px;padding:4px 10px;cursor:pointer;border-radius:2px;transition:all .12s;}
.filter-btn:hover:not(:disabled){border-color:var(--g);color:var(--g);}
.filter-btn.on{background:rgba(184,240,152,.08);border-color:var(--g);color:var(--g);}
.filter-btn:disabled{opacity:.2;cursor:not-allowed;}
.catalog-hdr{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:11px;}
.cat-list{display:flex;flex-direction:column;gap:9px;}
.cat-group{background:var(--s1);border:1px solid var(--border);border-radius:4px;overflow:hidden;}
.cat-head{display:flex;align-items:center;gap:9px;padding:9px 13px;background:var(--s2);cursor:pointer;user-select:none;}
.cat-icon{font-size:13px;}
.cat-name{font-family:'Syne',sans-serif;font-weight:700;font-size:10px;letter-spacing:.13em;text-transform:uppercase;color:var(--text);flex:1;}
.cat-chev{font-size:9px;color:var(--muted);transition:transform .2s;}
.cat-group.open .cat-chev{transform:rotate(180deg);}
.cat-items{display:none;flex-wrap:wrap;gap:6px;padding:9px 13px;}
.cat-group.open .cat-items{display:flex;}
.chip{background:transparent;border:1px solid var(--dim);color:var(--muted);
  font-family:'DM Mono',monospace;font-size:10px;padding:4px 9px;cursor:pointer;
  border-radius:2px;transition:all .1s;display:flex;align-items:center;gap:4px;}
.chip:hover{border-color:var(--g);color:var(--g);}
.chip.sg{border-color:var(--g);background:rgba(184,240,152,.07);color:var(--g);}
.chip.sb{border-color:var(--b);background:rgba(126,184,247,.07);color:var(--b);}
.chip-dot{width:4px;height:4px;border-radius:50%;background:currentColor;flex-shrink:0;}
.chip-dim{color:var(--dim);margin-left:3px;font-size:9px;}

/* QUIZ */
.quiz-wrap{display:none;}
.quiz-wrap.visible{display:block;}
.quiz-score{display:flex;align-items:center;gap:14px;margin-bottom:20px;padding:11px 16px;background:var(--s2);border:1px solid var(--border);border-radius:4px;}
.qs-label{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);}
.qs-val{font-family:'Syne',sans-serif;font-weight:800;font-size:17px;color:var(--gold);}
.qs-streak{font-size:10px;color:var(--muted);margin-left:auto;}
.quiz-question{background:var(--s1);border:1px solid var(--border);border-radius:6px;padding:24px 28px;margin-bottom:16px;position:relative;overflow:hidden;}
.quiz-question::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--gold),var(--orange));}
.qz-label{font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:13px;}
.qz-stem{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(15px,2.2vw,19px);line-height:1.6;color:var(--text);}
.quiz-options{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:20px;}
.qz-opt{background:var(--s1);border:1px solid var(--border);border-radius:4px;
  padding:14px 17px;cursor:pointer;transition:all .15s;text-align:left;display:flex;align-items:flex-start;gap:10px;}
.qz-opt:hover:not(.locked){border-color:rgba(247,201,126,.4);background:rgba(247,201,126,.04);}
.qz-opt.locked{cursor:not-allowed;}
.qz-opt.correct{border-color:var(--g)!important;background:rgba(184,240,152,.08)!important;}
.qz-opt.wrong{border-color:#f07070!important;background:rgba(240,112,112,.06)!important;opacity:.7;}
.qz-opt.missed{border-color:var(--g)!important;background:rgba(184,240,152,.04)!important;}
.opt-letter{font-family:'Syne',sans-serif;font-weight:800;font-size:11px;width:20px;height:20px;
  border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;
  background:var(--s2);color:var(--muted);margin-top:1px;}
.qz-opt.correct .opt-letter{background:var(--g);color:#060607;}
.qz-opt.wrong .opt-letter{background:#f07070;color:#fff;}
.qz-opt.missed .opt-letter{background:rgba(184,240,152,.2);color:var(--g);}
.opt-text{font-family:'Instrument Serif',serif;font-style:italic;font-size:14px;color:var(--text);line-height:1.35;}
.quiz-result{background:var(--s1);border:1px solid var(--border);border-radius:6px;
  padding:24px 28px;display:none;position:relative;overflow:hidden;animation:fadeUp .4s ease;}
.quiz-result.visible{display:block;}
.quiz-result::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;}
.quiz-result.correct-res::before{background:var(--g);}
.quiz-result.wrong-res::before{background:#f07070;}
.qr-verdict{font-family:'Syne',sans-serif;font-weight:800;font-size:20px;letter-spacing:-.5px;margin-bottom:10px;}
.correct-res .qr-verdict{color:var(--g);}
.wrong-res .qr-verdict{color:#f07070;}
.qr-expl{font-family:'Instrument Serif',serif;font-style:italic;font-size:clamp(14px,2.2vw,17px);line-height:1.65;color:var(--text);}
.qr-expl em{font-style:normal;color:var(--gold);}

@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
footer{text-align:center;margin-top:48px;padding-top:24px;border-top:1px solid var(--border);}
footer p{font-size:10px;color:var(--dim);letter-spacing:.1em;}
@media(max-width:580px){
  .pairs-grid,.step-cards,.quiz-options{grid-template-columns:1fr;}
  .divider-col{flex-direction:row;border:none;border-top:1px solid var(--border);border-bottom:1px solid var(--border);padding:9px 14px;}
  .dim-bar{grid-template-columns:1fr 1fr;}.dim-center{display:none;}
  .mode-tabs{flex-wrap:wrap;}
  .tab{flex:1 1 40%;}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <div class="logo">QUANTO<sup>?</sup></div>
  <p class="tagline">Hidden proportions between phenomena of the universe</p>
</header>

<div class="mode-tabs">
  <button class="tab active" data-mode="random">⚄ Random<span class="tab-sub">Discover hidden proportions</span></button>
  <button class="tab" data-mode="trova">? Find the Fourth<span class="tab-sub">Select 3, compute X</span></button>
  <button class="tab" data-mode="quiz">◈ Quiz<span class="tab-sub">Guess the fourth term</span></button>
</div>

<!-- PROP CARD (shared random+trova) -->
<div class="prop-card" id="propCard">
  <div class="dim-bar">
    <div class="dim-tag left"><span id="dimLIcon">●</span><span id="dimLLabel">Pair 1</span></div>
    <div class="dim-center"></div>
    <div class="dim-tag right" id="dimTagR"><span id="dimRIcon">●</span><span id="dimRLabel">Pair 2</span></div>
  </div>
  <div class="pairs-grid">
    <div class="pair-col left">
      <div class="pair-item top" id="piL0"><div class="pi-empty">—</div></div>
      <div class="pair-arrow" id="arrowL">↕</div>
      <div class="pair-item bottom" id="piL1"><div class="pi-empty">—</div></div>
    </div>
    <div class="divider-col">
      <div class="ratio-pill left" id="ratioL">—</div>
      <div class="eq-sym" id="eqSym">≈</div>
      <div class="ratio-pill right" id="ratioR">—</div>
    </div>
    <div class="pair-col right" id="pairRight">
      <div class="pair-item top" id="piR0"><div class="pi-empty">—</div></div>
      <div class="pair-arrow" id="arrowR">↕</div>
      <div class="pair-item bottom" id="piR1"><div class="pi-empty">—</div></div>
    </div>
  </div>
</div>

<!-- BTN RANDOM -->
<div class="btn-zone" id="btnRandZone">
  <button class="btn-main" id="btnRandom">⚄ &nbsp;Random Proportion</button>
</div>

<!-- BTN TROVA -->
<div class="btn-zone" id="btnTrovaZone" style="display:none">
  <button class="btn-reset" id="btnReset">↺ &nbsp;Start Over</button>
</div>

<!-- TROVA SECTION -->
<div class="trova-wrap" id="trovaWrap">
  <div class="step-cards" id="stepCards"></div>
  <div class="filter-bar" id="filterBar"><span class="filter-label">Dimension:</span></div>
  <div class="catalog-hdr">Phenomena catalog</div>
  <div class="cat-list" id="catList"></div>
</div>

<!-- QUIZ SECTION -->
<div class="quiz-wrap" id="quizWrap">
  <div class="quiz-score">
    <div><div class="qs-label">Score</div><div class="qs-val" id="qsVal">0 / 0</div></div>
    <div class="qs-streak" id="qsStreak"></div>
  </div>
  <div class="quiz-question" id="quizQuestion">
    <div class="qz-label">◈ Proportion quiz</div>
    <div class="qz-stem" id="qzStem"></div>
  </div>
  <div class="quiz-options" id="quizOptions"></div>
  <div class="quiz-result" id="quizResult">
    <div class="qr-verdict" id="qrVerdict"></div>
    <div class="qr-expl" id="qrExpl"></div>
  </div>
  <div class="btn-zone" style="margin-top:20px;margin-bottom:0">
    <button class="btn-main" id="btnNewQuiz">⚄ &nbsp;New Question</button>
  </div>
</div>

<footer><p>QUANTO — hidden proportions between phenomena of the universe</p></footer>
</div>

<script>
const SEC_PER_YEAR = 3.156e7;

/* ══════════════════════════════════════
   DIMENSIONS
══════════════════════════════════════ */
const DIM = {
  size:        {label:"Size",        icon:"🔬", unit:"m"},
  distance:    {label:"Distance",    icon:"📏", unit:"m"},
  duration:    {label:"Duration",    icon:"⏳", unit:"years"},
  timeago:     {label:"Time ago",    icon:"📅", unit:"years ago"},
  temperature: {label:"Temperature", icon:"🌡️", unit:"K"},
  mass:        {label:"Mass",        icon:"⚖️", unit:"kg"},
  energy:      {label:"Energy",      icon:"⚡", unit:"J"},
  probability: {label:"Probability", icon:"%",  unit:""},
};

/* ══════════════════════════════════════
   FORMAT
══════════════════════════════════════ */
function fvTime(s){
  const y=s/SEC_PER_YEAR;
  if(y>=1e9)return(y/1e9).toPrecision(3)+" Bln yrs";
  if(y>=1e6)return(y/1e6).toPrecision(3)+" Mln yrs";
  if(y>=1000)return(y/1000).toPrecision(3)+"k yrs";
  if(y>=1)return parseFloat(y.toPrecision(3))+" yrs";
  const d=s/86400;
  if(d>=1)return parseFloat(d.toPrecision(3))+" days";
  return parseFloat(s.toPrecision(3))+" s";
}

function fvProb(p){
  const inv=1/p;
  if(inv<=1)return"1 in 1";
  if(inv>=1e9)return`1 in ${(inv/1e9).toPrecision(3)}B`;
  if(inv>=1e6)return`1 in ${(inv/1e6).toPrecision(3)}M`;
  if(inv>=1e3)return`1 in ${Math.round(inv/1e3)}k`;
  return`1 in ${Math.round(inv).toLocaleString("en-US")}`;
}

function fv(item){
  const{val,dim}=item;
  if(dim==="duration"||dim==="timeago")return fvTime(val);
  if(dim==="probability")return fvProb(val);
  const a=Math.abs(val);
  if(a>=1e24)return(val/1e24).toPrecision(3)+" ×10²⁴";
  if(a>=1e21)return(val/1e21).toPrecision(3)+" ×10²¹";
  if(a>=1e18)return(val/1e18).toPrecision(3)+" ×10¹⁸";
  if(a>=1e15)return(val/1e15).toPrecision(3)+" ×10¹⁵";
  if(a>=1e12)return(val/1e12).toPrecision(3)+" ×10¹²";
  if(a>=1e9)return(val/1e9).toPrecision(3)+" Bln";
  if(a>=1e6)return(val/1e6).toPrecision(3)+" Mln";
  if(a>=1e3)return(val/1e3).toPrecision(3)+"k";
  if(a>=1)return parseFloat(val.toPrecision(3))+"";
  if(a>=1e-3)return(val*1e3).toPrecision(2)+" ×10⁻³";
  if(a>=1e-6)return(val*1e6).toPrecision(2)+" ×10⁻⁶";
  if(a>=1e-9)return(val*1e9).toPrecision(2)+" ×10⁻⁹";
  if(a>=1e-12)return(val*1e12).toPrecision(2)+" ×10⁻¹²";
  if(a>=1e-27)return(val*1e27).toPrecision(2)+" ×10⁻²⁷";
  return val.toExponential(2);
}

function displayUnit(item){
  if(item.dim==="duration")return fvTime(item.val).split(" ").slice(1).join(" ")||"yrs";
  if(item.dim==="timeago")return"years ago";
  if(item.dim==="probability")return"";
  return item.unit;
}

function fRatio(r){
  const a=Math.abs(r);
  if(a>=1e12)return(a/1e12).toFixed(1)+" ×10¹²×";
  if(a>=1e9)return(a/1e9).toFixed(1)+" Bln ×";
  if(a>=1e6)return(a/1e6).toFixed(1)+" Mln ×";
  if(a>=1e3)return(a/1e3).toFixed(1)+"k ×";
  return a.toFixed(1)+"×";
}

/* ══════════════════════════════════════
   CATALOG
══════════════════════════════════════ */
const ITEMS = [
  // SIZE
  {id:"obs_univ",      name:"Observable universe radius",    cat:"🌌 Cosmic",      dim:"size",val:4.4e26,unit:"m"},

/* ══════════════════════════════════════
   RANDOM PROPORTION
══════════════════════════════════════ */
function byDim(){
  const m={};
  ITEMS.forEach(i=>{if(!m[i.dim])m[i.dim]=[];m[i.dim].push(i);});
  return m;
}

function findProportion(){
  const dm=byDim();
  const dims=Object.keys(dm).filter(d=>dm[d].length>=2);
  let best=null,bestScore=Infinity;
  for(let att=0;att<1000;att++){
    const sd=[...dims].sort(()=>Math.random()-.5);
    const dA=sd[0],dB=sd[1];
    if(!dm[dA]||!dm[dB])continue;
    const pA=dm[dA],pB=dm[dB];
    const ai=Math.floor(Math.random()*pA.length);
    let bi=Math.floor(Math.random()*pA.length);
    while(bi===ai)bi=Math.floor(Math.random()*pA.length);
    const ci=Math.floor(Math.random()*pB.length);
    let di=Math.floor(Math.random()*pB.length);
    while(di===ci)di=Math.floor(Math.random()*pB.length);
    const sA=pA[ai].val<pA[bi].val?pA[ai]:pA[bi];
    const lA=pA[ai].val<pA[bi].val?pA[bi]:pA[ai];
    const sB=pB[ci].val<pB[di].val?pB[ci]:pB[di];
    const lB=pB[ci].val<pB[di].val?pB[di]:pB[ci];
    if(sA.val<=0||sB.val<=0)continue;
    const rA=lA.val/sA.val,rB=lB.val/sB.val;
    if(rA<2||rB<2)continue;
    const diff=Math.abs(Math.log10(rA)-Math.log10(rB));
    if(diff<0.6&&diff<bestScore){bestScore=diff;best={p1:[sA,lA],p2:[sB,lB],ratio1:rA,ratio2:rB,dim1:dA,dim2:dB};}
  }
  return best;
}

function displayProportion(p,isX=false){
  currentProp={...p,isX};
  document.getElementById("dimLIcon").textContent=DIM[p.dim1].icon;
  document.getElementById("dimLLabel").textContent=DIM[p.dim1].label;
  document.getElementById("dimRIcon").textContent=DIM[p.dim2].icon;
  document.getElementById("dimRLabel").textContent=DIM[p.dim2].label;
  document.getElementById("dimTagR").className="dim-tag right"+(isX?" orange":"");
  document.getElementById("pairRight").className="pair-col right"+(isX?" x-mode":"");
  fillPI("piL0",p.p1[0],"small");
  fillPI("piL1",p.p1[1],"large");
  fillPI("piR0",p.p2[0],"small");
  fillPI("piR1",p.p2[1],isX?"X — computed":"large",isX);
  document.getElementById("ratioL").textContent=fRatio(p.ratio1);
  document.getElementById("arrowL").textContent="× "+fRatio(p.ratio1);
  if(isX){
    document.getElementById("ratioR").className="ratio-pill x";
    document.getElementById("ratioR").textContent="≈ "+fRatio(p.ratio2);
    document.getElementById("arrowR").textContent="× "+fRatio(p.ratio2)+" (X)";
    document.getElementById("eqSym").textContent="=";
  } else {
    document.getElementById("ratioR").className="ratio-pill right";
    document.getElementById("ratioR").textContent=fRatio(p.ratio2);
    document.getElementById("arrowR").textContent="× "+fRatio(p.ratio2);
    document.getElementById("eqSym").textContent="≈";
  }
}

function fillPI(id,item,sub,isX=false){
  let extra="";
  if(isX&&item.dim==="timeago"){
    const y=Math.round(2025-item.val/SEC_PER_YEAR);
    extra=`<div class="pi-unit" style="color:var(--orange);margin-top:2px">≈ year ${y>0?y:Math.abs(y)+" BC"}</div>`;
  }
  document.getElementById(id).innerHTML=`
    <div class="pi-sub">${sub}</div>
    <div class="pi-name"${isX?' style="color:var(--orange)"':''}>${item.name}</div>
    <div class="pi-val">${fv(item)}</div>
    <div class="pi-unit">${displayUnit(item)}</div>${extra}`;
}

const STEP_DEFS=[
  {key:"A",label:"A · small",hint:"First dimension"},
  {key:"B",label:"B · large", hint:"Same dim as A"},
  {key:"C",label:"C · small",hint:"Second dimension"},
  {key:"X",label:"X · computed",hint:"Automatic"},
];

function buildStepCards(){
  const cont=document.getElementById("stepCards");
  cont.innerHTML="";
  STEP_DEFS.forEach((def,i)=>{
    const card=document.createElement("div");
    const isX=i===3;
    let cls="step-card";
    if(isX)cls+=" x-card";
    else if(i<tStep)cls+=(i<2?" done-g":" done-b");
    else if(i===tStep)cls+=" active";
    card.className=cls;
    if(isX){
      const xVal=tStep===3&&tSlots[0]&&tSlots[1]&&tSlots[2]?tSlots[2].val*(tSlots[1].val/tSlots[0].val):null;
      const xItem=xVal?{val:xVal,dim:tSlots[2].dim}:null;
      let xExtra="";
      if(xItem&&xItem.dim==="timeago"){
        const y=Math.round(2025-xVal/SEC_PER_YEAR);
        xExtra=`<div class="sc-val" style="font-size:10px;color:var(--muted)">≈ year ${y>0?y:Math.abs(y)+" BC"}</div>`;
      }
      card.innerHTML=`<div class="sc-num">X · large (dim 2)</div><div class="sc-name">${xVal?"computed":"automatic"}</div>${xItem?`<div class="sc-val">${fv(xItem)}</div>${xExtra}`:""}`;
    } else {
      const item=tSlots[i];
      card.innerHTML=`<div class="sc-num">${def.label}</div><div class="sc-name">${item?item.name:def.hint}</div>${item?`<div class="sc-val">${fv(item)}</div>`:""} ${i===tStep?'<div class="sc-pulse"></div>':""}`;
    }
    cont.appendChild(card);
  });
}

function buildFilterBar(){
  const bar=document.getElementById("filterBar");
  bar.innerHTML='<span class="filter-label">Dimension:</span>';
  Object.entries(DIM).forEach(([key,cfg])=>{
    const btn=document.createElement("button");
    let allowed=true;
    if(tStep===1)allowed=(key===tDim1);
    if(tStep===2)allowed=(key!==tDim1);
    btn.className="filter-btn"+(activeDimFilter===key?" on":"")+(allowed?"":" disabled");
    if(!allowed)btn.disabled=true;
    btn.textContent=cfg.icon+" "+cfg.label;
    btn.addEventListener("click",()=>{
      activeDimFilter=activeDimFilter===key?null:key;
      buildFilterBar();buildCatalog();
    });
    bar.appendChild(btn);
  });
}

function buildCatalog(){
  const list=document.getElementById("catList");
  list.innerHTML="";
  const bycat={};
  ITEMS.forEach(item=>{
    if(activeDimFilter&&item.dim!==activeDimFilter)return;
    if(tStep===1&&item.dim!==tDim1)return;
    if(tStep===2&&item.dim===tDim1)return;
    if(!bycat[item.cat])bycat[item.cat]=[];
    bycat[item.cat].push(item);
  });
  Object.entries(bycat).forEach(([cat,items],i)=>{
    const div=document.createElement("div");
    div.className="cat-group"+(i===0?" open":"");
    const h=document.createElement("div");
    h.className="cat-head";
    h.innerHTML=`<span class="cat-icon">${cat.split(" ")[0]}</span><span class="cat-name">${cat.split(" ").slice(1).join(" ")}</span><span class="cat-chev">▼</span>`;
    h.addEventListener("click",()=>div.classList.toggle("open"));
    const body=document.createElement("div");
    body.className="cat-items";
    items.forEach(item=>{
      const ch=document.createElement("button");
      const sel=tSlots.includes(item);
      ch.className="chip"+(sel?(tSlots.indexOf(item)<2?" sg":" sb"):"");
      ch.dataset.id=item.id;
      const dispVal=item.dim==="probability"?fv(item):"";
      ch.innerHTML=`<span class="chip-dot"></span>${item.name}${dispVal?`<span class="chip-dim">${dispVal}</span>`:`<span class="chip-dim">${DIM[item.dim].icon}</span>`}`;
      ch.addEventListener("click",()=>onTrovaChip(item));
      body.appendChild(ch);
    });
    div.appendChild(h);div.appendChild(body);
    list.appendChild(div);
  });
}

function onTrovaChip(item){
  if(tStep>=3)return;
  tSlots[tStep]=item;
  if(tStep===0){tDim1=item.dim;activeDimFilter=tDim1;}
  else if(tStep===2){activeDimFilter=null;}
  tStep++;
  buildStepCards();buildFilterBar();buildCatalog();
  if(tStep===3)triggerTrova();
}

function triggerTrova(){
  const[A,B,C]=tSlots;
  const ratio=B.val/A.val;
  const xVal=C.val*ratio;
  const X={name:"X (computed)",val:xVal,unit:C.unit,dim:C.dim};
  buildStepCards();
  displayProportion({p1:[A,B],p2:[C,X],ratio1:ratio,ratio2:ratio,dim1:A.dim,dim2:C.dim},true);
}

function resetTrova(){
  tSlots=[null,null,null];tStep=0;tDim1=null;activeDimFilter=null;
  ["piL0","piL1","piR0","piR1"].forEach(id=>document.getElementById(id).innerHTML='<div class="pi-empty">—</div>');
  ["ratioL","ratioR"].forEach(id=>document.getElementById(id).textContent="—");
  ["arrowL","arrowR"].forEach(id=>document.getElementById(id).textContent="↕");
  document.getElementById("eqSym").textContent="≈";
  document.getElementById("dimLLabel").textContent="Pair 1";
  document.getElementById("dimRLabel").textContent="Pair 2";
  document.getElementById("dimLIcon").textContent="●";
  document.getElementById("dimRIcon").textContent="●";
  document.getElementById("dimTagR").className="dim-tag right";
  document.getElementById("pairRight").className="pair-col right";
  currentProp=null;
  buildStepCards();buildFilterBar();buildCatalog();
}

/* ══════════════════════════════════════
   QUIZ (static)
══════════════════════════════════════ */
let quizBankIdx=[];
let quizBankPos=0;

function shuffleBank(){
  quizBankIdx=[...Array(QUIZ_BANK.length).keys()].sort(()=>Math.random()-.5);
  quizBankPos=0;
}

function updateScoreUI(){
  document.getElementById("qsVal").textContent=`${quizScore.correct} / ${quizScore.total}`;
  const s=quizScore.streak;
  document.getElementById("qsStreak").textContent=s>=2?`🔥 Streak of ${s}`:"";
}

function generateQuiz(){
  quizLocked=false;quizCorrectIdx=-1;
  document.getElementById("quizResult").className="quiz-result";
  document.getElementById("quizResult").style.display="none";
  document.getElementById("quizOptions").style.display="none";

  if(quizBankPos>=quizBankIdx.length)shuffleBank();
  const q=QUIZ_BANK[quizBankIdx[quizBankPos++]];

  document.getElementById("qzStem").textContent=q.stem;

  const opts=[...q.options].sort(()=>Math.random()-.5);
  ["A","B","C","D"].forEach((l,i)=>opts[i].label=l);
  quizCorrectIdx=opts.findIndex(o=>o.correct);

  const optCont=document.getElementById("quizOptions");
  optCont.style.display="grid";optCont.innerHTML="";
  opts.forEach((opt,i)=>{
    const btn=document.createElement("button");
    btn.className="qz-opt";btn.dataset.idx=i;
    btn.innerHTML=`<div class="opt-letter">${opt.label}</div><div class="opt-text">${opt.text}</div>`;
    btn.addEventListener("click",()=>answerQuiz(i,q.explanation));
    optCont.appendChild(btn);
  });
}

function answerQuiz(chosenIdx,explanation){
  if(quizLocked)return;
  quizLocked=true;
  quizScore.total++;
  const correct=chosenIdx===quizCorrectIdx;
  if(correct){quizScore.correct++;quizScore.streak++;}
  else{quizScore.streak=0;}
  updateScoreUI();
  document.querySelectorAll(".qz-opt").forEach((btn,i)=>{
    btn.classList.add("locked");
    if(i===quizCorrectIdx)btn.classList.add(chosenIdx===i?"correct":"missed");
    else if(i===chosenIdx&&!correct)btn.classList.add("wrong");
  });
  const res=document.getElementById("quizResult");
  res.style.display="block";
  res.className="quiz-result visible "+(correct?"correct-res":"wrong-res");
  document.getElementById("qrVerdict").textContent=correct?"✓ Correct!":"✗ Not quite.";
  document.getElementById("qrExpl").innerHTML=explanation;
  res.scrollIntoView({behavior:"smooth",block:"nearest"});
}

function switchMode(m){
  mode=m;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.mode===m));
  document.getElementById("btnRandZone").style.display=m==="random"?"flex":"none";
  document.getElementById("btnTrovaZone").style.display=m==="trova"?"flex":"none";
  document.getElementById("trovaWrap").classList.toggle("visible",m==="trova");
  document.getElementById("quizWrap").classList.toggle("visible",m==="quiz");
  document.getElementById("propCard").style.display=m==="quiz"?"none":"";
  if(m==="trova")resetTrova();
  if(m==="quiz")generateQuiz();
}

function flash(msg){
  const el=document.createElement("div");
  el.style.cssText="position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:#1a1a22;border:1px solid rgba(247,160,126,.4);color:var(--orange);font-family:'DM Mono',monospace;font-size:11px;padding:10px 20px;border-radius:4px;z-index:999;transition:opacity .3s;pointer-events:none;";
  el.textContent=msg;document.body.appendChild(el);
  setTimeout(()=>{el.style.opacity="0";setTimeout(()=>el.remove(),300);},2200);
}
